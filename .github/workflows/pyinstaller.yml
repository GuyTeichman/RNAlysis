name: Pyinstaller Release

on:
    push:
        tags:
            - 'V*' #
    workflow_dispatch:
        # A manual run is ALWAYS a beta freeze smoke-test: it builds the standalone app only
        # (no GitHub Release, no commit, no version bump) and uploads the frozen apps as
        # downloadable run artifacts to test the PyInstaller freeze by hand. Only a tag push
        # (the `V*` trigger above) cuts a real release. The event type is the sole discriminator,
        # so there is deliberately no `beta` input to get wrong — and nothing here has to reach
        # the default branch before a beta can be dispatched from a feature/development branch.

env:
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:

    createrelease:
        name: Create Release
        # Runs ONLY on a tag push (github.event_name == 'push'). Every manual run
        # (workflow_dispatch) is a beta freeze smoke-test and must never commit to master or
        # publish a Release, so createrelease is skipped for it — no exceptions, no input to flip.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.VID_CHECKSUM_PAT }}
                  persist-credentials: true

            - name: Install dev requirements
              run: python -m pip install --upgrade -r requirements_dev.txt

            - name: Calculate checksums
              run: python packaging/checksum_videos.py

            - name: Generate Changelog
              run: python packaging/generate_changelog.py

            - uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: Calculate quick-start video checksums and generate changelog
                  file_pattern: 'rnalysis/gui/videos/checksums/*.txt rnalysis/data_files/latest_changelog.md'
                  branch: master

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: ${{ github.ref }}
                name: Stable release ${{ github.ref_name }}
                body_path: rnalysis/data_files/latest_changelog.md
                draft: false
                prerelease: false
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


            - name: Output Release URL File
              run: echo "${{ steps.create_release.outputs.upload_url }}" > release_url.txt

            - name: Save Release URL File for publish
              uses: actions/upload-artifact@v7
              with:
                  name: release_url
                  path: release_url.txt

    build:
        name: Build packages
        needs: createrelease
        # Runs for both real releases and beta smoke-tests. always() lets it proceed when
        # createrelease was skipped (a manual beta run); it is still blocked if createrelease
        # actually failed on a real release (don't upload assets to a Release that never got made).
        if: ${{ always() && needs.createrelease.result != 'failure' && needs.createrelease.result != 'cancelled' }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: macos-latest
                      TARGET: macos-M1
                      CMD_BUILD: >
                          pyinstaller RNAlysis.spec &&
                          cd dist/ &&
                          zip -r RNAlysis-4.3.0_macos_M1.zip ./RNAlysis* &&
                          ls -ltr
                      OUT_FILE_NAME: RNAlysis-4.3.0_macos_M1.zip
                      ASSET_MIME: application/zip

                    - os: windows-latest
                      TARGET: windows
                      CMD_BUILD: >
                          pyinstaller RNAlysis.spec &&
                          cd dist/ &&
                          7z a RNAlysis-4.3.0_windows.zip -r "RNAlysis-4.3.0/"
                      OUT_FILE_NAME: RNAlysis-4.3.0_windows.zip
                      ASSET_MIME: application/zip

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: brew update (macOS)
              if: runner.os == 'MacOS'
              run: brew update

            - name: Setup Graphviz
              uses: ts-graphviz/setup-graphviz@v2
              with:
                  macos-skip-brew-update: 'true'
            - name: Test GraphViz installation
              run: dot -V
            - name: Cache LLVM and Clang
              id: cache-llvm
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/llvm
                  key: llvm

            - name: Install LLVM and Clang
              if: runner.os != 'macOS'
              uses: KyleMayes/install-llvm-action@v2
              with:
                  version: "14.0"
                  directory: ${{ runner.temp }}/llvm
                  cached: ${{ steps.cache-llvm.outputs.cache-hit }}

            - name: command line tools on MacOS
              if: runner.os == 'macOS'
              run: |
                  gcc -v -xc++ /dev/null -fsyntax-only

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13
                  cache: 'pip'

            - name: Install PyInstaller requirements
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade -r requirements_pyinstaller.txt

            - name: Install dependencies
              run: python -m pip install .[all]

            - name: Build with pyinstaller for ${{ matrix.TARGET }}
              run: ${{ matrix.CMD_BUILD }}

            - name: Upload beta artifact (freeze smoke-test)
              # Manual runs only: the standalone app as a downloadable run artifact, no Release.
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v7
              with:
                  name: RNAlysis-BETA-${{ matrix.TARGET }}-${{ github.sha }}
                  path: ./dist/${{ matrix.OUT_FILE_NAME }}
                  retention-days: 14

            - name: Load Release URL File from release job
              if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: actions/download-artifact@v8
              with:
                  name: release_url
                  path: release_url

            - name: Get Release File Name & Upload URL
              if: ${{ github.event_name != 'workflow_dispatch' }}
              id: get_release_info
              run: |
                  value=$(cat release_url/release_url.txt)
                  echo "UPLOAD_URL=$value" >> $GITHUB_ENV
              shell: bash
            - name: Upload Release Asset
              if: ${{ github.event_name != 'workflow_dispatch' }}
              id: upload-release-asset
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ./dist/${{ matrix.OUT_FILE_NAME }}
