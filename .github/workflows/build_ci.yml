name: Build CI

on:
    pull_request:
        # Skip CI for documentation-only PRs. The job still runs whenever a PR changes at least one
        # file that is NOT matched below (e.g. a code change bundled with a HISTORY.rst update).
        paths-ignore:
            - '**/*.md'
            - '**/*.rst'
            - 'docs/**'
            - '.claude/**'
jobs:
    build:

        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
                python-version: [ '3.12', '3.13', '3.14' ]
        env:
            DISPLAY: ':99.0'
            HDF5_DISABLE_VERSION_CHECK: '2'
            # Install R packages (DESeq2/limma/Rsubread) into a stable, cacheable location so they
            # aren't recompiled from source on every run (see the "Cache R packages" step).
            R_LIBS_USER: ${{ github.workspace }}/.r-libs
            # Use the faster sys.monitoring coverage backend (Python >=3.12, coverage >=7.7).
            COVERAGE_CORE: sysmon
            # Let `uv pip install` target the actions/setup-python interpreter instead of requiring a
            # virtualenv (see the "Install uv" / "Install dependencies" steps).
            UV_SYSTEM_PYTHON: 1
            # Only one job (Ubuntu / Python 3.13) collects coverage; every other job runs the tests
            # without the coverage tracer, which is faster (most noticeably on Windows). This is the
            # test-runner command the tier steps below invoke.
            RUN_TESTS: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') && 'coverage run --append --source=rnalysis/ -m pytest' || 'python -m pytest' }}
            # A native crash (e.g. the flaky Qt access violation in the e2e tier) kills the process
            # without pytest reporting which test was running. tests/conftest.py writes each test's
            # nodeid here before it runs, so the "Report last test before a crash" step below can name
            # the culprit. No effect on runs where this env var is unset (e.g. local runs).
            PYTEST_CRASH_BREADCRUMB: ${{ github.workspace }}/pytest_last_test.txt
        steps:
            -   name: Configure pagefile
                if: runner.os == 'Windows'
                uses: al-cheb/configure-pagefile-action@v1.2

            -   name: Set up pagefile
                if: runner.os == 'Windows'
                run: |
                    (Get-CimInstance Win32_PageFileUsage).AllocatedBaseSize
            -   name: Get repository
                uses: actions/checkout@v5
                with:
                    # docs/build/ is ~600 MB of committed, generated Sphinx output that the tests
                    # never read. Excluding it from the sparse checkout speeds up "Get repository".
                    sparse-checkout: |
                        /*
                        !/docs/build
                    sparse-checkout-cone-mode: false
            -   name: apt-get update (Linux)
                if: runner.os == 'Linux'
                run: sudo apt-get update
            -   name: Setup Qt requirements for Linux
                uses: tlambert03/setup-qt-libs@v1
            -   name: Setup Graphviz
                uses: ts-graphviz/setup-graphviz@v2
                with:
                    # Skip to run brew update command on macOS.
                    macos-skip-brew-update: 'true' # defalt false
            -   name: Cache LLVM and Clang
                if: runner.os != 'macOS'
                id: cache-llvm
                uses: actions/cache@v5
                with:
                    path: ${{ runner.temp }}/llvm
                    key: llvm
            -   name: Install LLVM and Clang
                if: runner.os != 'macOS'
                uses: KyleMayes/install-llvm-action@v2
                with:
                    version: "14.0"
                    directory: ${{ runner.temp }}/llvm
                    cached: ${{ steps.cache-llvm.outputs.cache-hit }}
            -   name: Install R
                uses: r-lib/actions/setup-r@v2
                with:
                    r-version: '4.4' # The R version to download (if necessary) and use.
            -   name: Cache R packages (DESeq2/limma/Rsubread)
                # The DE/featureCounts integration tests compile these Bioconductor packages from
                # source at test time; caching R_LIBS_USER avoids recompiling them on every run.
                uses: actions/cache@v5
                with:
                    path: ${{ github.workspace }}/.r-libs
                    key: r-libs-${{ runner.os }}-R4.4-${{ hashFiles('rnalysis/data_files/r_templates/*_install.R') }}
                    restore-keys: |
                        r-libs-${{ runner.os }}-R4.4-
            -   name: Install homebrew on Linux
                if: runner.os == 'Linux'
                uses: Homebrew/actions/setup-homebrew@master
            -   name: Install cURL on Linux
                if: runner.os == 'Linux'
                run: sudo apt-get install libcurl4-openssl-dev
            -   name: Install cURL on Windows
                if: runner.os == 'Windows'
                run: choco install openssl
            -   name: Install libxml on MacOS
                if: runner.os == 'macOS'
                run: brew install libxml2
            -   name: command line tools on MacOS
                if: runner.os == 'macOS'
                run: |
                    gcc -v -xc++ /dev/null -fsyntax-only
            -   name: Test R installation
                run: Rscript -e "print('R script ran successfully')"
            -   name: Cache kallisto & bowtie2 binaries
                id: cache-bio-tools
                uses: actions/cache@v5
                with:
                    path: |
                        ${{ github.workspace }}/kallisto
                        ${{ github.workspace }}/bowtie2-2.5.1-mingw-x86_64
                    key: bio-tools-${{ runner.os }}-kallisto0.51.1-bowtie2v2.5.1
            -   name: Install kallisto
                run: |
                    # macOS needs the hdf5 runtime whether or not the binary was restored from cache.
                    if [ "$RUNNER_OS" == "macOS" ]; then
                         brew install hdf5
                         # Trick dyld into using the newer hdf5 library version
                         ln -sf /opt/homebrew/opt/hdf5/lib/libhdf5.dylib /opt/homebrew/opt/hdf5/lib/libhdf5.310.dylib
                    fi
                    # Download only on a cache miss; the extracted 'kallisto' dir is restored otherwise.
                    if [ ! -d "${GITHUB_WORKSPACE}/kallisto" ]; then
                         if [ "$RUNNER_OS" == "Linux" ]; then
                              wget  https://github.com/pachterlab/kallisto/releases/download/v0.51.1/kallisto_linux-v0.51.1.tar.gz
                         elif [ "$RUNNER_OS" == "macOS" ]; then
                              wget  https://github.com/pachterlab/kallisto/releases/download/v0.51.1/kallisto_mac_m1-v0.51.1.tar.gz
                         elif [ "$RUNNER_OS" == "Windows" ]; then
                              choco install wget -y
                              wget  https://github.com/pachterlab/kallisto/releases/download/v0.51.1/kallisto_windows-v0.51.1.tar.gz
                         else
                              echo "$RUNNER_OS not supported"
                              exit 1
                         fi
                         tar -xvzf kallisto*.gz
                    fi
                    echo "${GITHUB_WORKSPACE}/kallisto" >> $GITHUB_PATH
                shell: bash
                continue-on-error: true
            -   name: Test kallisto installation
                run: kallisto version
            -   name: Install bowtie2
                run: |
                    if [ "$RUNNER_OS" == "Windows" ]; then
                         # Download only on a cache miss; the extracted dir is restored otherwise.
                         if [ ! -d "${GITHUB_WORKSPACE}/bowtie2-2.5.1-mingw-x86_64" ]; then
                              choco install wget -y
                              wget  https://github.com/BenLangmead/bowtie2/releases/download/v2.5.1/bowtie2-2.5.1-mingw-x86_64.zip
                              7z x bowtie2-2.5.1-mingw-x86_64.zip
                         fi
                         echo "${GITHUB_WORKSPACE}/bowtie2-2.5.1-mingw-x86_64" >> $GITHUB_PATH
                    else
                         brew install bowtie2
                    fi
                shell: bash
            -   name: Test bowtie2 installation
                run: |
                    bowtie2 --version
                    bowtie2-build-s --version
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install uv
                # uv resolves + installs far faster than pip (most noticeably on Windows). It caches
                # built wheels itself (enable-cache), so setup-python's pip cache is no longer needed.
                # Pinned to a full version on purpose: setup-uv no longer publishes a moving `@v9` major
                # tag, so `@v9.0.0` (not `@v9`) is the correct current pin.
                uses: astral-sh/setup-uv@v9.0.0
                with:
                    enable-cache: true
                    cache-dependency-glob: |
                        requirements*.txt
                        pyproject.toml
            -   name: Install dependencies
                # UV_SYSTEM_PYTHON=1 (job env) makes these install into the setup-python interpreter.
                run: |
                    uv pip install --upgrade -r requirements_dev.txt
                    uv pip install .[all]
            -   name: Prepare R library cache dir
                # R only puts R_LIBS_USER on .libPaths() (and installs there) if the dir exists.
                run: python -c "import os, pathlib; pathlib.Path(os.environ['R_LIBS_USER']).mkdir(parents=True, exist_ok=True)"
            # Tests run in tiers (unit -> integration_net -> integration_tools -> e2e). A failure in a
            # faster tier stops the slower ones (fail-fast). The integration tier is split into a
            # network/web-API step and an R/CLI-tools step so we can see the per-tier breakdown (both
            # still run on every matrix cell for now). `--durations=25` prints the slowest tests in
            # each tier. Only the coverage job wraps them in `coverage run` (see RUN_TESTS above);
            # every other job invokes pytest directly. Tiers are assigned automatically in
            # tests/conftest.py; see pytest.ini for definitions.
            -   name: Unit tests
                run: ${{ env.RUN_TESTS }} -m unit --durations=25 tests/
            -   name: Integration tests (network / web APIs)
                run: ${{ env.RUN_TESTS }} -m integration_net --durations=25 tests/
            -   name: Integration tests (R / CLI tools)
                run: ${{ env.RUN_TESTS }} -m integration_tools --durations=25 tests/
            -   name: End-to-end (GUI) tests
                run: ${{ env.RUN_TESTS }} -m e2e --durations=25 tests/
            -   name: Report last test before a crash
                # Runs whenever a prior tier failed (incl. a native crash that produced no pytest
                # summary). Surfaces the breadcrumb written by tests/conftest.py so the flaky e2e crash
                # names the exact test instead of an anonymous "access violation".
                if: failure()
                shell: bash
                run: |
                    if [ -f "${GITHUB_WORKSPACE}/pytest_last_test.txt" ]; then
                        echo "::warning::Last test started before failure/crash: $(cat "${GITHUB_WORKSPACE}/pytest_last_test.txt")"
                    else
                        echo "No crash breadcrumb file was written."
                    fi
            # Interactive tmate debug session on failure. Disabled by default: tmate holds the runner
            # open until the session is closed or times out, which freezes the job on every failure.
            # Re-enable on demand by setting the repository variable ENABLE_TMATE to 'true'.
            -   name: Setup tmate session if tests fail
                if: failure() && vars.ENABLE_TMATE == 'true'
                timeout-minutes: 15
                uses: mxschmitt/action-tmate@v3
            -   name: Generate lcov file
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
                run: coverage lcov
            -   name: Coveralls Parallel
                uses: coverallsapp/github-action@v2
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
                continue-on-error: true
                with:
                    flag-name: run-${{ join(matrix.*, '-') }}
                    parallel: true
                    path-to-lcov: ./coverage.lcov

    finish:
        name: Finish submitting coverage
        if: ${{ always() }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   name: Coveralls Finished
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    parallel-finished: true
