name: Update contributors roster

# Keeps the "Contributors" list in README.rst in sync with GitHub's contributor list, without any
# per-contributor manual step. Runs weekly (and on demand); if the roster changed it opens a PR into
# development rather than committing directly, so the change is reviewed and respects branch rules.
on:
    schedule:
        - cron: '0 6 * * 1'   # Mondays 06:00 UTC
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update-contributors:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # Compute the roster against development (the base of the PR opened below), so the
                    # branch is cut from the same ref it targets and can't re-add already-merged names.
                    ref: development
            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.13'
            -   name: Update README contributor roster
                # Dependency-free (stdlib only) — no `pip install` needed. Appends new GitHub
                # contributors; never removes hand-added names.
                run: python packaging/contributors.py --update-readme
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            -   name: Open a PR if the roster changed
                uses: peter-evans/create-pull-request@v8
                with:
                    base: development
                    branch: chore/update-contributors
                    delete-branch: true
                    title: 'chore: update contributors roster'
                    commit-message: 'chore: update contributors roster'
                    labels: github_actions
                    body: |
                        Automated update of the contributor roster in `README.rst`: new GitHub
                        contributors were appended (nobody is removed). Generated by
                        .github/workflows/update-contributors.yml.
