# Pre-commit hooks for RNAlysis — https://pre-commit.com/
# One-time setup per clone (after `pip install -r requirements_dev.txt`):
#
#     pre-commit install
#
# Thanks to `default_install_hook_types` below, that installs BOTH git hooks:
#   - pre-commit: on `git commit`, runs every hook on ONLY the files that commit touches;
#   - pre-push:   on `git push`, runs every hook again on the files changed between the remote
#     branch and what you are pushing (the working-tree copies of those files) -- a safety net for
#     commits made before the hook was installed, or from another tool/worktree. A fixer hook
#     (whitespace, EOF, line endings, Ruff) that changes a file there aborts the push: commit its
#     fixes and push again.
# Clones set up before pre-push was added: run `pre-commit install` once more to add it.
#
# A repo-wide `ruff format` / `ruff check --fix` sweep has already been applied once
# (see the "Repo-wide Ruff format + import-sort sweep" commit); going forward these hooks keep
# the tree in that state incrementally. To run everything by hand: `pre-commit run -a`.
#
# CI (.github/workflows/pre-commit.yml) runs these same hooks on every pull request and on every
# push to `development`/`master`, scoped to just the files the PR (or the pushed range of commits)
# changed (`pre-commit run --from-ref <base> --to-ref <head>`), not
# `--all-files` — a full-repo run is for a deliberate, one-off sweep only (see above), not routine
# PR checks.
#
# `exclude` below keeps every hook off content that must not be hand-normalized:
#   - docs/build/       : ~600 MB of committed, generated Sphinx HTML, regenerated at release time.
#   - docs/source/rnalysis.*.rst : sphinx-apidoc-generated per-function stubs (see CLAUDE.md: "don't
#     hand-edit them") — same story, regenerated on every docs build.
#   - tests/test_files/ : test fixtures and "truth" reference files compared verbatim by tests;
#     normalizing their line endings/whitespace risks silently changing what a test asserts against.
#   - rnalysis/data_files/r_templates/ : R script templates read and echoed verbatim (via string
#     substitution, not re-rendered) into generated DESeq2/limma/featureCounts scripts, which are
#     then compared byte-for-byte against tests/test_files/*/expected_*.R truth files. A hygiene
#     fix here (e.g. end-of-file-fixer trimming a trailing blank line) changes generated output
#     without changing the excluded truth files to match, breaking that comparison — this exact
#     failure mode broke CI on the sweep's first attempt (logging.R lost a trailing blank line).
#   - rnalysis/data_files/report_templates/ : vendored third-party libraries (Bootstrap, vis-network
#     minified JS/CSS) — not ours to reformat.
exclude: '^(docs/build/|docs/source/rnalysis\..*\.rst$|tests/test_files/|rnalysis/data_files/r_templates/|rnalysis/data_files/report_templates/)'

default_install_hook_types: [pre-commit, pre-push]

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]        # enforce LF, matching .editorconfig
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Linter — scoped to import sorting only (see [lint] select in ruff.toml).
      - id: ruff-check
        args: [--fix]
      # Formatter — Black-compatible, configured in ruff.toml (line-length 120, single quotes).
      - id: ruff-format

  - repo: local
    hooks:
      # Every parameter the GUI renders for a public filtering/enrichment/fastq function must have
      # ":param name: ..." help text that the GUI's own docstring parser can read (see CLAUDE.md,
      # "the API<->GUI reflection contract"; what is checked, and the known approximations of a
      # static check, are documented atop packaging/check_gui_docstrings.py). Stdlib-only: the
      # script never imports rnalysis, so the hook needs none of RNAlysis's dependencies.
      - id: check-gui-docstrings
        name: check GUI help text in public API docstrings
        entry: python packaging/check_gui_docstrings.py
        language: python
        files: ^(rnalysis/(filtering|enrichment|fastq)\.py|rnalysis/utils/docstring_parsing\.py|packaging/check_gui_docstrings\.py)$
